<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="styel.css">
    <script defer src="./index.js"></script>
</head>
<body>
    <h1> 🎬 Movie App</h1>
    <input type="text" id="movie-input" placeholder="Search  Your Favorite Here ..." style="
    font-size: larger;
    background-color: rgb(236, 135, 3);
    outline: none;
    border: none;
    border-radius: 10px;
    padding: 10px;
    width: 300px;
    color: white;
    ">
    <button id="search-btn" style="
    font-size: larger;
     margin-left:15px;
     background-color: aqua;
     border-radius: 10px;
     padding: 10px;
      ">Get Movie</button>
      <div id="loading" class="movie-grid"></div>
      <div id="result"></div>
</body>
</html>
