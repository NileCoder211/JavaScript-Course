<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="recipefinder.css">
    <script defer src="recipefinder.js"></script>
</head>
<body>
    <div class="container">
    <h1>Find your favorite recipe here</h1>
    <div class="input">
    <input class="search-input" id="search-input" type="text" name="search" placeholder="Search your favorite recipe by title here...">
    <button id="clear-btn" type="reset">Reset Recipe</button>
    </div>
    <ul id="recipe-List"></ul>
    </div>
</body>
</html>
